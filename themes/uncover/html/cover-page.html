<!DOCTYPE html>
<!--
  cover-page.html — "L2 Photo Band" cover for the uncover theme.
  ─────────────────────────────────────────────────────────
  A dark, minimal page with the hero photo revealed through a centred band,
  full-page crosshair rules and a thin inner frame. Brand-colour logo badge
  top-right, two-tier headline and company lines bottom-left. White text.

  Template tokens (replaced at export time):
    {{COVER_TITLE_MAIN}}  Primary title line (before a separating dash/colon)
    {{COVER_SUBTITLE}}    Subtitle (after the separator), or empty
    {{COVER_INFO_ROWS}}   Zero or more <span> pairs for the info table
    {{COVER_ADDRESS}}     Company address lines joined with <br>
    {{LOGO_IMG}}    White brand logo <img>, or empty string
    {{REVISION_TABLE}}    Full <table> fragment (revision history), or empty
    {{COVER_LOGO_IMG}} Wrapped <img> for the cover logo, or empty string
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover page preview</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/cover.css">
</head>

<body>

  <div class="cover-page cover-l2" id="cover-page">
    <div class="cover-l2-band">
      <span class="cover-l2-cross cover-l2-cross-v"></span>
      <span class="cover-l2-cross cover-l2-cross-h"></span>
    </div>
    <div class="cover-l2-frame"></div>
    <div class="cover-l2-top">
      <div class="cover-l2-badge"><span class="cover-l2-logo">{{LOGO_IMG}}</span></div>
    </div>
    <div class="cover-l2-bottom">
      <h1 class="cover-title">{{COVER_TITLE_MAIN}}</h1>
      <p class="cover-subtitle">{{COVER_SUBTITLE}}</p>
      <div class="cover-l2-meta">
        {{COVER_INFO_ROWS}}
        <p class="cover-address">{{COVER_ADDRESS}}</p>
        <p class="cover-slogan">{{COVER_SLOGAN}}</p>
      </div>
      <div class="cover-l2-rev">{{REVISION_TABLE}}</div>
    </div>
    <div class="cover-l2-cover">{{COVER_LOGO_IMG}}</div>
  </div>

</body>

</html>
