<!DOCTYPE html>
<!--
  cover-page.html — "Light Minimal" cover for the markedapp-byword theme.
  A clean light page: hero photo across the top, then generous whitespace and a
  dark two-tier headline with a thin rule and the document info below.

  Tokens: {{COVER_TITLE_MAIN}} {{COVER_SUBTITLE}}
          {{COVER_INFO_ROWS}} {{COVER_ADDRESS}} {{LOGO_DARK_IMG}}
          {{REVISION_TABLE}} {{COVER_LOGO_IMG}}
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover page preview</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/cover.css">
</head>

<body>

  <div class="cover-page cover-bw" id="cover-page">
    <div class="cover-bw-photo"></div>
    <div class="cover-bw-body">
      <div class="cover-bw-head">
        <span class="cover-bw-logo">{{LOGO_DARK_IMG}}</span>
      </div>
      <div class="cover-bw-title-wrap">
        <h1 class="cover-title">{{COVER_TITLE_MAIN}}</h1>
        <p class="cover-subtitle">{{COVER_SUBTITLE}}</p>
        <span class="cover-bw-rule"></span>
      </div>
      <div class="cover-bw-foot">
        {{COVER_INFO_ROWS}}
        <p class="cover-address">{{COVER_ADDRESS}}</p>
        <p class="cover-slogan">{{COVER_SLOGAN}}</p>
        <div class="cover-bw-rev">{{REVISION_TABLE}}</div>
      </div>
    </div>
    <div class="cover-bw-cover">{{COVER_LOGO_IMG}}</div>
  </div>

</body>

</html>
