<!DOCTYPE html>
<!--
  cover-page.html — "Centered Editorial" cover for the jasonm23 theme.
  Full-bleed hero photo under a dark vignette; a centred serif headline framed
  by thin accent rules, with the document info centred below.

  Tokens: {{COVER_TITLE_MAIN}} {{COVER_SUBTITLE}}
          {{COVER_INFO_ROWS}} {{COVER_ADDRESS}} {{LOGO_IMG}}
          {{REVISION_TABLE}} {{COVER_LOGO_IMG}}
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover page preview</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/cover.css">
</head>

<body>

  <div class="cover-page cover-jm" id="cover-page">
    <div class="cover-jm-inner">
      <div class="cover-jm-top">
        <span class="cover-jm-logo">{{LOGO_IMG}}</span>
      </div>
      <div class="cover-jm-mid">
        <div class="cover-jm-cover">{{COVER_LOGO_IMG}}</div>
        <span class="cover-jm-rule"></span>
        <h1 class="cover-title">{{COVER_TITLE_MAIN}}</h1>
        <p class="cover-subtitle">{{COVER_SUBTITLE}}</p>
        <span class="cover-jm-rule"></span>
      </div>
      <div class="cover-jm-bottom">
        {{COVER_INFO_ROWS}}
        <p class="cover-address">{{COVER_ADDRESS}}</p>
        <p class="cover-slogan">{{COVER_SLOGAN}}</p>
        <div class="cover-jm-rev">{{REVISION_TABLE}}</div>
      </div>
    </div>
  </div>

</body>

</html>
