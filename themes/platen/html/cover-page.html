<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platen cover preview</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/cover.css">
</head>
<body>
  <div class="cover-page cover-platen" id="cover-page">
    <div class="platen-masthead">
      <div class="platen-wordmark">{{LOGO_IMG}}</div>
      <p class="cover-slogan">{{COVER_SLOGAN}}</p>
    </div>
    <div class="platen-cover-body">
      <div class="platen-title-block">
        <h1 class="cover-title">{{COVER_TITLE_MAIN}}</h1>
        <p class="cover-subtitle">{{COVER_SUBTITLE}}</p>
        <div class="platen-customer-logo">{{COVER_LOGO_IMG}}</div>
      </div>
    </div>
    <div class="platen-cover-details">
      <div class="platen-document-info">{{COVER_INFO_ROWS}}</div>
      <p class="cover-address">{{COVER_ADDRESS}}</p>
      <div class="platen-revisions">{{REVISION_TABLE}}</div>
    </div>
  </div>
</body>
</html>
