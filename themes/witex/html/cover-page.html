<!DOCTYPE html>
<!--
  cover-page.html — "Classic Title Page" cover for the witex theme.
  A light, academic title page: a thin double border frames the page, with a
  centred serif headline, a framed hero photo, and the document info below.

  Tokens: {{COVER_TITLE_MAIN}} {{COVER_SUBTITLE}}
          {{COVER_INFO_ROWS}} {{COVER_ADDRESS}} {{LOGO_DARK_IMG}}
          {{REVISION_TABLE}} {{COVER_LOGO_IMG}}
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover page preview</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/cover.css">
</head>

<body>

  <div class="cover-page cover-wx" id="cover-page">
    <div class="cover-wx-frame">
      <div class="cover-wx-head">
        <span class="cover-wx-logo">{{LOGO_DARK_IMG}}</span>
      </div>
      <div class="cover-wx-titleblock">
        <span class="cover-wx-rule"></span>
        <h1 class="cover-title">{{COVER_TITLE_MAIN}}</h1>
        <p class="cover-subtitle">{{COVER_SUBTITLE}}</p>
        <span class="cover-wx-rule"></span>
      </div>
      <div class="cover-wx-photo"></div>
      <div class="cover-wx-foot">
        {{COVER_INFO_ROWS}}
        <p class="cover-address">{{COVER_ADDRESS}}</p>
        <p class="cover-slogan">{{COVER_SLOGAN}}</p>
        <div class="cover-wx-rev">{{REVISION_TABLE}}</div>
      </div>
    </div>
    <div class="cover-wx-cover">{{COVER_LOGO_IMG}}</div>
  </div>

</body>

</html>
