<!DOCTYPE html>
<!--
  cover-page.html — "L5 Diagonal Brochure" cover for the solarized theme.
  ─────────────────────────────────────────────────────────
  Hero photo across the top; a magenta wedge and a solarized-teal lower zone
  meet in a diagonal chevron traced by a thin light seam. Two-tier headline,
  info and revision history sit in the teal zone; a brand cluster (logo +
  wordmark + contact marks) sits top-right over the photo.

  Template tokens (replaced at export time):
    {{COVER_TITLE_MAIN}}  Primary title line (before a separating dash/colon)
    {{COVER_SUBTITLE}}    Subtitle (after the separator), or empty
    {{COVER_INFO_ROWS}}   Zero or more <span> pairs for the info table
    {{COVER_ADDRESS}}     Company address lines joined with <br>
    {{LOGO_IMG}}    White brand logo <img>, or empty string
    {{REVISION_TABLE}}    Full <table> fragment (revision history), or empty
    {{COVER_LOGO_IMG}} Wrapped <img> for the cover logo, or empty string
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover page preview</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/cover.css">
</head>

<body>

  <div class="cover-page cover-l5" id="cover-page">
    <div class="cover-l5-photo"></div>
    <div class="cover-l5-decor"></div>
    <div class="cover-l5-top">
      <div class="cover-l5-brand">
        <span class="cover-l5-logo">{{LOGO_IMG}}</span>
      </div>
    </div>
    <div class="cover-l5-block">
      <h1 class="cover-title">{{COVER_TITLE_MAIN}}</h1>
      <p class="cover-subtitle">{{COVER_SUBTITLE}}</p>
      <div class="cover-l5-meta">
        {{COVER_INFO_ROWS}}
        <p class="cover-address">{{COVER_ADDRESS}}</p>
        <p class="cover-slogan">{{COVER_SLOGAN}}</p>
      </div>
      <div class="cover-l5-rev">{{REVISION_TABLE}}</div>
    </div>
    <div class="cover-l5-cover">{{COVER_LOGO_IMG}}</div>
  </div>

</body>

</html>
