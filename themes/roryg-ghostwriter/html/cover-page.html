<!DOCTYPE html>
<!--
  cover-page.html — "Sidebar" cover for the roryg-ghostwriter theme.
  A dark vertical sidebar on the left holds the logo, a stacked two-tier
  headline and the document info; the hero photo fills the right.

  Tokens: {{COVER_TITLE_MAIN}} {{COVER_SUBTITLE}}
          {{COVER_INFO_ROWS}} {{COVER_ADDRESS}} {{LOGO_IMG}}
          {{REVISION_TABLE}} {{COVER_LOGO_IMG}}
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover page preview</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/cover.css">
</head>

<body>

  <div class="cover-page cover-gw" id="cover-page">
    <div class="cover-gw-photo"></div>
    <div class="cover-gw-side">
      <div class="cover-gw-head">
        <span class="cover-gw-logo">{{LOGO_IMG}}</span>
      </div>
      <div class="cover-gw-title-wrap">
        <span class="cover-gw-rule"></span>
        <h1 class="cover-title">{{COVER_TITLE_MAIN}}</h1>
        <p class="cover-subtitle">{{COVER_SUBTITLE}}</p>
        <div class="cover-gw-cover">{{COVER_LOGO_IMG}}</div>
      </div>
      <div class="cover-gw-foot">
        {{COVER_INFO_ROWS}}
        <p class="cover-address">{{COVER_ADDRESS}}</p>
        <p class="cover-slogan">{{COVER_SLOGAN}}</p>
        <div class="cover-gw-rev">{{REVISION_TABLE}}</div>
      </div>
    </div>
  </div>

</body>

</html>
