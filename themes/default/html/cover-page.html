<!DOCTYPE html>
<!--
  cover-page.html — "L4 Navy Panel" cover for the neutral default theme.
  ─────────────────────────────────────────────────────────
  A solid brand-navy panel on the left holds the logo, two-tier headline and
  document info in white; the hero photo is revealed through a circular window
  on the right.

  Template tokens (replaced at export time):
    {{COVER_TITLE_MAIN}}  Primary title line (before a separating dash/colon)
    {{COVER_SUBTITLE}}    Subtitle (after the separator), or empty
    {{COVER_INFO_ROWS}}   Zero or more <span> pairs for the info table
    {{COVER_ADDRESS}}     Company address lines joined with <br>
    {{LOGO_IMG}}    White brand logo <img>, or empty string
    {{REVISION_TABLE}}    Full <table> fragment (revision history), or empty
    {{COVER_LOGO_IMG}} Wrapped <img> for the cover logo, or empty string
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover page preview</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/cover.css">
</head>

<body>

  <div class="cover-page cover-l4" id="cover-page">
    <div class="cover-l4-photo"></div>
    <div class="cover-l4-panel">
      <div class="cover-l4-head">
        <span class="cover-l4-logo">{{LOGO_IMG}}</span>
      </div>
      <div class="cover-l4-mid">
        <div>
          <h1 class="cover-title">{{COVER_TITLE_MAIN}}</h1>
          <p class="cover-subtitle">{{COVER_SUBTITLE}}</p>
          <span class="cover-l4-rule"></span>
        </div>
      </div>
      <div class="cover-l4-foot">
        <p class="cover-l4-eyebrow">Document details</p>
        <div class="cover-l4-info">{{COVER_INFO_ROWS}}</div>
        <p class="cover-address">{{COVER_ADDRESS}}</p>
        <p class="cover-slogan">{{COVER_SLOGAN}}</p>
        <div class="cover-l4-rev">{{REVISION_TABLE}}</div>
      </div>
    </div>
    <div class="cover-l4-cover">{{COVER_LOGO_IMG}}</div>
  </div>

</body>

</html>
